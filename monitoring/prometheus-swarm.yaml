# Как часто Prometheus будет собирать metrics.
global:
  scrape_interval: 15s

  # Как часто пересчитывать alert/recording rules.
  # Пока rules нет, но нормальную базовую настройку оставляем.
  evaluation_interval: 15s


# Что именно Prometheus должен мониторить.
scrape_configs:

  # ----------------------------------------------------------
  # Сам Prometheus
  # ----------------------------------------------------------
  - job_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090


  # ----------------------------------------------------------
  # Все наши Linux VM через Node Exporter
  # ----------------------------------------------------------
  - job_name: node-exporter

    # Node Exporter работает в mode: global.
    #
    # Поэтому Docker DNS:
    # tasks.monitoring_node-exporter
    #
    # вернёт IP ВСЕХ task:
    # manager exporter
    # worker1 exporter
    # worker2 exporter
    dns_sd_configs:

      - names:
          - tasks.monitoring_node-exporter

        # Ищем IPv4 адреса.
        type: A

        # На этом порту Node Exporter отдаёт metrics.
        port: 9100

        # Обновлять список task каждые 15 секунд.
        refresh_interval: 15s


  # ----------------------------------------------------------
  # Accounts PostgreSQL
  # ----------------------------------------------------------
  - job_name: accounts-postgres

    static_configs:
      - targets:
          - accounts-db-exporter:9187


  # ----------------------------------------------------------
  # Ledger PostgreSQL
  # ----------------------------------------------------------
  - job_name: ledger-postgres

    static_configs:
      - targets:
          - ledger-db-exporter:9187