name: Build and publish images

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/alim7007/bank-of-olim
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: src/frontend

          - service: userservice
            context: src/accounts/userservice

          - service: contacts
            context: src/accounts/contacts

          - service: accounts-db
            context: src/accounts/accounts-db

          - service: ledger-db
            context: src/ledger/ledger-db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  java-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - ledgerwriter
          - balancereader
          - transactionhistory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with Jib
        run: |
          ./mvnw \
            -f src/ledger/${{ matrix.service }}/pom.xml \
            compile jib:build \
            -Dimage=${IMAGE_PREFIX}-${{ matrix.service }}:${GITHUB_SHA} \
            -Djib.from.platforms=${PLATFORMS}

  update-gitops:
    name: Update GitOps image versions
    runs-on: ubuntu-latest

    needs:
      - docker-images
      - java-images

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v6
        with:
          repository: alim7007/bank-of-olim-infra
          ref: ${{ github.ref_name }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update image versions
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
        run: |
          VALUES="kubernetes/environments/${ENVIRONMENT}/apps/bank-of-olim/values.yaml"

          sed -i -E \
            "s|^    tag: .*|    tag: ${IMAGE_TAG}|g" \
            "$VALUES"

      - name: Commit GitOps update
        working-directory: infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/environments/*/apps/bank-of-olim/values.yaml

          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi

          git commit -m "Update Bank of Olim images to ${IMAGE_TAG:0:7}"
          git pull --rebase
          git push